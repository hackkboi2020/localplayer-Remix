name: Fork Build APK

# Builds an installable APK on every push to master (or manually).
# - With signing secrets configured: signed release APK.
# - Without them: debug APK (works out of the box, no setup needed).

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore (optional)
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_STORE_PASSWORD" && -n "$ANDROID_SIGNING_KEY_ALIAS" && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets found. Building a debug APK with a throwaway key; it cannot be installed as an update over a previous build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Version name = newest version in CHANGELOG.en.md + run number. Gradle derives the
      # version code from the base version, so fork builds and tagged releases of the same
      # version share a code and install over each other as normal updates.
      - name: Determine version
        id: version
        run: |
          BASE=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.en.md || true)
          BASE=${BASE:-1.0.0}
          echo "name=${BASE}-fork.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_SIGNING_STORE_FILE: release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PappVersionName="${{ steps.version.outputs.name }}"

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug --no-daemon -PappVersionName="${{ steps.version.outputs.name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localplayer-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
